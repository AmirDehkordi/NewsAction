# NA-14 captions (PRD NA-14 S4). Every number is cited as {{table/key/column[@spec]}} from artifacts/NA-14/tables
# (keys.json); [[...]] marks a label or a design constant. `python -m newsaction.figures.captions` renders
# captions.md and fails on an unknown key, a bare number or a cited value that differs from its table cell.
# Results are captioned as found (NA-12 and NA-13 REPORTs), never as the PRD expected them.

fig1_convergence:
  section: 4
  title: Prices move part of the way to the model's value on day t, then partly fade
  caption: >-
    Convergence to the news-implied value (PREREG A1), test period. (a, b) Mean CAR^lvl, the cumulative abnormal
    return in typical daily moves from the previous close, of the D0 events by decile of the decision model's value
    V, against each decile's mean V (dashed): Laya-Fin, the primary instrument, and d1-ultra, the API comparator,
    which fails the §8.3 screens and is model-specific (§1.3). Prices reach part of each decile's target by the
    open and the close of day t, then partly fade: d1-ultra's top decile (mean V
    {{f1_v_decile_paths/d1_ultra|v_decile|10|car_post0/mean_v@f2}}) stands at
    {{f1_v_decile_paths/d1_ultra|v_decile|10|car_lvl_o0/mean@signed2}} at the open,
    {{f1_v_decile_paths/d1_ultra|v_decile|10|car_post0/mean@signed2}} at the close and
    {{f1_v_decile_paths/d1_ultra|v_decile|10|car_post20/mean@signed2}} at [[t+20]]; its bottom decile (mean V
    {{f1_v_decile_paths/d1_ultra|v_decile|1|car_post0/mean_v@signed2}}) at
    {{f1_v_decile_paths/d1_ultra|v_decile|1|car_lvl_o0/mean@signed2}},
    {{f1_v_decile_paths/d1_ultra|v_decile|1|car_post0/mean@signed2}} and
    {{f1_v_decile_paths/d1_ultra|v_decile|1|car_post20/mean@signed2}}. Laya-Fin's deciles are ordered the same way
    but smaller. Before the event the prices drift in V's direction (not drawn): five sessions earlier d1-ultra's top
    decile stood {{f1_v_decile_paths/d1_ultra|v_decile|10|car_pre5/mean@signed2}} and its bottom decile
    {{f1_v_decile_paths/d1_ultra|v_decile|1|car_pre5/mean@signed2}} from the previous close; the states describe the
    company's recent performance in words, so part of V reflects momentum. Bands: ±[[1.96]] event-level SE (deciles [[1]] and [[10]]; descriptive). (c) The convergence
    ladder κ_h, the slope of CAR^lvl_h on V with day × tier fixed effects, and its 95% interval from the two-way
    clustered SE, against full convergence at [[κ = 1]]. κ peaks on day t or just after and is far from one:
    Laya-Fin {{t6_convergence_ladder/laya_fin:ladder:C_t/kappa@f2}} to
    {{t6_convergence_ladder/laya_fin:ladder:C_t+2/kappa@f2}} from the close of t to [[t+2]], d1-ultra
    {{t6_convergence_ladder/d1_ultra:ladder:C_t/kappa@f2}} to {{t6_convergence_ladder/d1_ultra:ladder:10:00/kappa@f2}}
    at [[10:00]] and the close. It fades by [[t+10]] ({{t6_convergence_ladder/laya_fin:ladder:C_t+10/kappa@f2}} and
    {{t6_convergence_ladder/d1_ultra:ladder:C_t+10/kappa@f2}}); Laya-Fin's increase from the open to [[t+20]] is
    {{t6_convergence_ladder/laya_fin:ladder:increase/kappa@signed2}} (p
    {{t6_convergence_ladder/laya_fin:ladder:increase/kappa_p}}). The half-life of the gap U = V − G, the first
    horizon at which λ_h reaches [[0.5]], is not reached within [[t+20]] for any model
    ({{t7_gap_closure/laya_fin:D2:all:half_life/lambda}} in t7). The anchor is uninformative (near-constant
    outputs). (d) d1-ultra's D2 events by RG class, signed in the news' direction, against each class's mean signed
    V: the {{f1_rg_class_paths/d1_ultra|rg_class_signed|Under|car_post0/n_group@int}} "Under" events move against
    the news on day t ({{f1_rg_class_paths/d1_ultra|rg_class_signed|Under|car_post0/mean@signed2}}) and never catch
    up ({{f1_rg_class_paths/d1_ultra|rg_class_signed|Under|car_post20/mean@signed2}} at [[t+20]]); the
    {{f1_rg_class_paths/d1_ultra|rg_class_signed|Over|car_post0/n_group@int}} "Over" events give back part of their
    move, from {{f1_rg_class_paths/d1_ultra|rg_class_signed|Over|car_post0/mean@signed2}} at the close to
    {{f1_rg_class_paths/d1_ultra|rg_class_signed|Over|car_post20/mean@signed2}} at [[t+20]]. Laya-Fin has only
    {{t30_derived/laya_fin:rg_events/value@int}} D2 events with |N̂| ≥ [[0.5]], so its class paths are not drawn.
    Decision points: [[D0]] at the open, [[D1]] at [[10:00]], [[D2]] at the close. The convergence tests ([[H2-C]])
    are not supported after Benjamini–Hochberg, and [[H2]], the primary test of over- and under-reaction, is
    {{t1_primary/H2/verdict}} for Laya-Fin (Holm p {{t1_primary/H2/primary_p_holm}}).

fig2_drift_vs_move:
  section: 4
  title: Large moves reverse slightly in every news-strength tercile; smaller moves do not
  caption: >-
    Drift after the close against the size of the day's move, test period (NA-12 figure data). Mean sign(G)·y2, the
    abnormal return from the next open to the close of [[t+5]] in the direction of the day's move G, in typical
    daily moves, by bin of |G| within terciles of news strength |V| (Call A on the day's news): (a) weak, (b) medium,
    (c) strong news; 95% intervals of ±[[1.96]] event-level SE. Moves with |G| ≥ [[3]] reverse slightly in every
    tercile: Laya-Fin {{f2_drift_vs_g/laya_fin|weak|[3, inf)/mean@signed2}},
    {{f2_drift_vs_g/laya_fin|medium|[3, inf)/mean@signed2}} and {{f2_drift_vs_g/laya_fin|strong|[3, inf)/mean@signed2}};
    d1-ultra {{f2_drift_vs_g/d1_ultra|weak|[3, inf)/mean@signed2}},
    {{f2_drift_vs_g/d1_ultra|medium|[3, inf)/mean@signed2}} and
    {{f2_drift_vs_g/d1_ultra|strong|[3, inf)/mean@signed2}}. Below |G| = [[3]] the means are small and of both signs;
    the one exception is d1-ultra's strong-news tercile, which also reverses slightly for moves of [[0.5]] to
    [[2]] ({{f2_drift_vs_g/d1_ultra|strong|[0.5, 1)/mean@signed2}} and
    {{f2_drift_vs_g/d1_ultra|strong|[1, 2)/mean@signed2}}). No bin below |G| = [[1]] has a positive mean outside its
    interval: there is no small-move underreaction. The pre-registered regression [[H2]] (y2 = a + b·N̂ + c·G with
    day × tier fixed effects at [[D2]]) finds b = {{t2_h2_over_under/laya_fin:D2/b@signed2}} (p
    {{t2_h2_over_under/laya_fin:D2/b_p}}) and c = {{t2_h2_over_under/laya_fin:D2/c@f3}} (p
    {{t2_h2_over_under/laya_fin:D2/c_p}}) for Laya-Fin: not supported. The anchor is uninformative (near-constant
    outputs).

fig3_tournament:
  section: 3
  title: Zero-shot API models price the open gap, and every positive validation IC falls on test
  caption: >-
    (a) The zero-shot tournament on NA-06's val-A stage-1 sample: daily IC of Call A's N̂ with z_cc and its 95%
    bootstrap interval against the cost per [[1,000]] decisions (log scale; the two local Laya models cost nothing).
    Every model is in the model confidence set. The six models that ran the stage-2 contamination screens (squares)
    all failed them: on masked states they still name the company in
    {{t23_company_identification/inception:mercury-decide/accuracy@pct0}} to
    {{t23_company_identification/liquid:d1-ultra/accuracy@pct0}} of cases against a matched baseline of
    {{t23_company_identification/liquid:d1-ultra/baseline_matched@pct0}} (Appendix Figure A3), so the API
    comparators are model-specific (§1.3). (b) Val-B (hollow) and test (filled) daily ICs on each model's D0 events,
    with 95% intervals of ±[[1.96]] Newey–West SE, and the cost per [[1,000]] decisions. Every IC that is positive on
    val-B falls on test: Laya-Fin {{t14_model_comparison/laya_fin/ic_val_b@f3}} to
    {{t14_model_comparison/laya_fin/ic_test@f3}}, d1-ultra {{t14_model_comparison/d1_ultra/ic_val_b@f3}} to
    {{t14_model_comparison/d1_ultra/ic_test@f3}} (at {{t14_model_comparison/d1_ultra/cost_per_1000@f3}} USD per
    [[1,000]] decisions); the anchor, bge-ridge and price-only are about zero in both. The highest test ICs belong to
    the vendor-label baselines (†: tags-GBM {{t14_model_comparison/baseline:tags_gbm/ic_test@f3}}, vendor sentiment
    {{t14_model_comparison/baseline:sentiment/ic_test@f3}}), whose labels were produced retrospectively: a possibly
    look-ahead-contaminated upper bound, not the benchmark. The clean benchmarks are bge-ridge
    ({{t14_model_comparison/baseline:embed_ridge/ic_test@f3}}), price-only
    ({{t14_model_comparison/baseline:price_only/ic_test@f3}}), the LLM baseline
    ({{t14_model_comparison/baseline:llm/ic_test@f3}}) and the placebo. The API models' signal is the open gap
    ([[H1]] = {{t1b_primary_by_model/d1_ultra:H1/estimate@f3}} for d1-ultra, p
    {{t1b_primary_by_model/d1_ultra:H1/p}}); for Laya-Fin [[H1]] is {{t1_primary/H1/verdict}}
    ({{t1_primary/H1/primary_estimate@f3}}, Holm p {{t1_primary/H1/primary_p_holm}}) and so is [[H1b]] (Holm p
    {{t1_primary/H1b/primary_p_holm}}). The anchor is uninformative (near-constant outputs). ‡ span-02: the S5
    canary fired a STOP after the freeze and the operator chose to proceed (PREREG §15, post-freeze NA-11 row).

fig4_monthly_ic:
  section: 3
  title: Every decision model was released after the sample, so no contamination cliff can show in it
  caption: >-
    Monthly mean of the daily IC of Call A's N̂_W0 with z_cc over val-A, val-B and the test period (NA-12) for
    Laya-Fin, the three API comparators (‡ span-02: S5 STOP after the freeze, the operator proceeded; PREREG §15)
    and the anchor (uninformative, near-constant outputs). The test period ends on {{t21_release_dates/sample_end/date}}.
    Laya's open weights, the base of Laya-Fin, were released on {{t21_release_dates/laya/date}}
    ({{t21_release_dates/laya/days_after_sample_end@int}} days later; date supplied by the operator) and the API
    models between {{t21_release_dates/drex_v2/date}} and {{t21_release_dates/span_02/date}} (NA-05 catalog): every
    release lies after the sample (gray region), so a contamination cliff at a release would fall outside the
    data. The API models' ICs fall toward zero late in the test period as Laya-Fin's do, while the anchor's scatter
    around zero throughout; a common decline is consistent with no contamination advantage but is not a test of
    it. In the last two test months the
    ICs are about zero for every model (Laya-Fin {{f4_monthly_ic/laya_fin|test|2026-06/ic@signed2}} and
    {{f4_monthly_ic/laya_fin|test|2026-07/ic@signed2}}, d1-ultra {{f4_monthly_ic/d1_ultra|test|2026-06/ic@signed2}}
    and {{f4_monthly_ic/d1_ultra|test|2026-07/ic@signed2}}). Exploratory (post hoc): a one-way test of the daily ICs
    on the calendar month finds no month effect (test p {{t24_exploratory_d0_signal/monthly:laya_fin:test/p@f2}}
    for Laya-Fin and {{t24_exploratory_d0_signal/monthly:d1_ultra:test/p@f2}} for d1-ultra), so the dip is within
    month-to-month noise.

fig5_shapley:
  section: 4
  title: The value of information at the close is about zero for every feature group
  caption: >-
    Exact Shapley values of the test-period out-of-sample R² (a–c) and mean daily IC (d–f) of y2 at [[D2]] over the
    feature groups R (price and reaction: G, the open gap, momentum, volume, tier), N (news, Call A: N̂, materiality,
    surprise, tone) and J (judgments, Call B: J, C, W), by tier, from the [[H3]] ridge fits (§11.5; fit on val-B or
    on train, λ on val-A, evaluated on test). The diamonds are the full model's totals: R²
    {{t13_shapley/laya_fin:all:r2:total/shapley@f4}} for Laya-Fin, {{t13_shapley/d1_ultra:all:r2:total/shapley@f4}}
    for d1-ultra and {{t13_shapley/anchor:all:r2:total/shapley@f4}} for the anchor (uninformative, near-constant
    outputs). Every total is about zero or negative, so the shares in t13 are shares of nothing and are not drawn.
    [[H3]], that J adds out-of-sample IC beyond R and N, is {{t1_primary/H3/verdict}} for Laya-Fin
    ({{t1_primary/H3/primary_estimate@f4}}, Holm p {{t1_primary/H3/primary_p_holm}}). Only [[D2]] is shown: the
    ridge protocol is fit at the one decision point [[H3]] tests.

fig6_filters:
  section: 2
  title: An embedding filter selects material news better than rule filters
  caption: >-
    Material recall against the share of val-A eval days selected, per candidate importance filter (NA-03 frontier,
    budgets from [[5%]] to [[50%]] of days). The frozen filter F5, a logistic regression on bge-small embeddings,
    selects {{t28_filter_frontier/F5|0.3/selected_share@pct0}} of days at its budget with material recall
    {{t28_filter_frontier/F5|0.3/recall_material@f3}}. F6 (LightGBM) reaches
    {{t28_filter_frontier/F6|0.3/recall_material@f3}} at the same budget, a tie within one point that goes to the
    filter with fewer inputs (§6.8). The rule filters F1–F4 recall {{t28_filter_frontier/F2|0.3/recall_material@f3}}
    to {{t28_filter_frontier/F3|0.3/recall_material@f3}} there, close to random selection (the diagonal); F0 keeps
    every clean article.

fig7_strategies:
  section: 6
  title: No pre-registered book survives costs and the deflated Sharpe; S-CONV is effectively the price-only gap fade
  caption: >-
    Cumulative net returns at [[10 bp]] per side, charged on both legs and the SPY hedge, over the test period
    (NA-13). (a) S-CONV, the primary strategy: rank D2 events by the gap U = V − G, enter at the next open, exit at
    [[t+5]]. (b) S-D0: rank by Ñ before the open, hold from the open to the close (light blue: the
    confidence-gated variant). (c) S-D1 J: [[10:00]] to the close. (d) S-D2 J: the next open to [[t+5]]. Each panel
    shows the benchmarks and the [[5th–95th]] percentile band of [[100]] random-signal books on Laya-Fin's events.
    At [[10 bp]] every S-CONV, S-D0 and J book of Laya-Fin and of d1-ultra is negative net (annualized Sharpe of
    the drawn books: S-CONV {{t20_strategies/test|S-CONV|laya_fin|D2|u|close_t+5|all/sharpe_net_10@signed2}}, gross
    {{t20_strategies/test|S-CONV|laya_fin|D2|u|close_t+5|all/sharpe_gross@signed2}}; S-D0
    {{t20_strategies/test|S-D0|laya_fin|D0|n_tilde|close_t|all/sharpe_net_10@signed2}}; S-D1 J
    {{t20_strategies/test|S-D1|laya_fin|D1|j|close_t|all/sharpe_net_10@signed2}}; S-D2 J
    {{t20_strategies/test|S-D2|laya_fin|D2|j|close_t+5|all/sharpe_net_10@signed2}}). The only books positive net are
    Laya-Fin's RG books, with {{t20_strategies/test|S-D1|laya_fin|D1|rg|close_t+5|all/n_positions@int}} to
    {{t20_strategies/test|S-D2|laya_fin|D2|rg|close_t+1|all/n_positions@int}} positions over the whole test period
    (|N̂| ≥ [[0.5]] is rare for it), and the anchor's gated S-D2 J held to [[t+20]]; none of them clears its
    placebo or the deflated Sharpe. S-CONV is effectively the
    price-only gap fade, because V is small next to G (U ≈ −G): the two books share
    {{t26_sconv_overlap/laya_fin:D2:close_t+5/shared_share@pct0}} of their positions,
    {{t26_sconv_overlap/laya_fin:D2:close_t+5/same_side_share@pct1}} of them on the same side, and their daily
    returns correlate {{t26_sconv_overlap/laya_fin:D2:close_t+5/corr_gross@f2}}. The anchor's S-CONV, built on an
    uninformative V (near-constant outputs), overlaps the gap fade even more
    ({{t26_sconv_overlap/anchor:D2:close_t+5/shared_share@pct0}}). No test book's gross Sharpe reaches the
    [[95th]] placebo percentile; the highest is the gated S-D0 held to the close of [[t+1]], not drawn
    ({{t20_strategies/test|S-D0|laya_fin|D0|n_tilde|close_t+1|gated/sharpe_gross@f2}} gross, placebo percentile
    {{t20_strategies/test|S-D0|laya_fin|D0|n_tilde|close_t+1|gated/placebo_pct_gross@f0}}). With
    {{t22_spend/trials/value@int}} trials in the ledger, the largest deflated-Sharpe probability of any test book is
    {{t20_strategies/test|S-D2|laya_fin|D2|rg|close_t+5|all/dsr_prob_net_10@f3}}. (e–g) Laya-Fin's S-CONV book and
    the gap fade by tier: descriptive sub-books of a null book, not separate tests. Vendor sentiment (†) is a
    possibly look-ahead-contaminated upper bound. Borrow costs are not modelled.

fig8_explain_move:
  section: 5
  title: The news explains little of a stock's own move; reading the move explains more but does not predict persistence
  caption: >-
    Explaining realized moves at the firm level (PREREG A3, after Kelly–Su–Zhang), test period. (a) d1-ultra's
    out-of-sample R² of the stock-specific daily move z_cc, stacked by step: ex-ante news (the [[D0]] readings),
    plus ex-post news (Call A on the day's news), plus the explanation features (Call B, which sees the move), by
    cut, with the final step's 95% bootstrap interval. Market and sector (Roll's step one) explain
    {{t10_explanation_ladder/roll_r2/r2@f2}} of the total daily variance; for the stock-specific part, ex-ante news
    reaches {{t10_explanation_ladder/d1_ultra:all:ex_ante/r2@f4}}, ex-post news
    {{t10_explanation_ladder/d1_ultra:all:ex_post/r2@f4}} and the explanation step
    {{t10_explanation_ladder/d1_ultra:all:explanation/r2@f3}} ({{t10_explanation_ladder/d1_ultra:event_days:explanation/r2@f3}}
    on event days). The explanation step is not a prediction: Call B reads the realized move. (b) The news-only
    steps of the three instruments, in thousandths, with 95% bootstrap intervals. Laya-Fin's same-day news explains
    {{t10_explanation_ladder/laya_fin:all:ex_post/r2@f4}} of the stock-specific variance, the only secondary test
    that survives Benjamini–Hochberg ([[H5]], q {{t4_secondary/laya_fin:H5/q}}), and
    {{t10_explanation_ladder/laya_fin:all:ex_ante/r2@f4}} of it was knowable before the open. The anchor is
    uninformative (near-constant outputs). (c) Persistence after [[D2]] by d1-ultra's move_reason, with 95%
    intervals: no reason persists significantly. θ, the [[D2]] regression of persistence on being explained, is
    {{t11_explanation_share_theta/theta:d2/value@signed2}} (SE {{t11_explanation_share_theta/theta:d2/se@f3}}, p
    {{t11_explanation_share_theta/theta:d2/p}}): explained moves do not persist more. Days that d1-ultra judges
    explained are {{t11_explanation_share_theta/share:all/events_share@pct0}} of event days and carry
    {{t11_explanation_share_theta/share:all/value@pct0}} of their Σz²_cc.

figA1_reliability:
  section: appendix
  title: Reliability of the three-class forecasts
  caption: >-
    Reliability of Q1's three classes (fall, no move or rise, split at ±[[0.5]] typical moves) against e5 on the
    test period: the hit rate of the top class by bin of its confidence ([[15]] bins; dot area proportional to the
    events in the bin; NA-12). The trained models are calibrated but barely informative: ECE
    {{t15_calibration/laya_fin:e5/ece@f3}} for Laya-Fin and {{t15_calibration/anchor:e5/ece@f3}} for the anchor
    (uninformative, near-constant outputs), with log-loss skill {{t15_calibration/laya_fin:e5/log_loss_skill@f3}}
    for Laya-Fin. The zero-shot and API models are overconfident: ECE {{t15_calibration/laya_zs:e5/ece@f3}} for Laya
    zero-shot, {{t15_calibration/d1_ultra:e5/ece@f3}} for d1-ultra, {{t15_calibration/span_02:e5/ece@f3}} for
    span-02 (‡: S5 STOP after the freeze, the operator proceeded) and {{t15_calibration/drex_v2:e5/ece@f3}} for
    drex-v2.0.

figA2_encoding:
  section: appendix
  title: How numbers are written in the state hardly matters
  caption: >-
    The encoding of numbers in states (NA-07; PREREG §8.4): daily IC of N̂ with z_cc by encoding [[E0]] to [[E4]] on
    NA-07's val-A sample (filled, 95% bootstrap intervals) and the val-B confirmation of [[E1]] and [[E3]] (hollow),
    for the three API comparators (‡ span-02: S5 STOP after the freeze, the operator proceeded). [[E1]] had the best
    mean val-A rank across the three models ({{t29_encoding/val_a|pooled|E1/rank@f2}}) and was selected there, but
    on val-B it fell short of [[E3]] by more than one standard error, so NA-07's rule kept [[E3]], the frozen
    encoding (d1-ultra on val-B: {{t29_encoding/val_b|liquid:d1-ultra|E1/ic@f3}} with [[E1]],
    {{t29_encoding/val_b|liquid:d1-ultra|E3/ic@f3}} with [[E3]]). On val-A the differences between encodings lie well
    inside the intervals.

figA3_identifiability:
  section: 7
  title: The API models identify the masked company; Laya zero-shot does not
  caption: >-
    (a) Company identification with activity-matched distractors on masked val-A states (NA-11; the §8.3 screen):
    the API models name the company in {{t23_company_identification/inception:mercury-decide/accuracy@pct0}} to
    {{t23_company_identification/liquid:d1-ultra/accuracy@pct0}} of states, against a matched baseline of
    {{t23_company_identification/liquid:d1-ultra/baseline_matched@pct0}} and the screen bar of
    {{t23_company_identification/liquid:d1-ultra/screen_threshold@pct0}}; Laya zero-shot names it in
    {{t23_company_identification/local:laya-typed-decisions/accuracy@pct0}}. The API models therefore fail the
    screen and are model-specific (§1.3). (b, c) Exploratory (post hoc): the probes' descriptive columns (NA-11,
    val-A), not hypotheses. (b) ICs on masked and unmasked states: unmasking does not raise them materially
    (d1-ultra {{t18_probes_val_a/liquid_d1-ultra/ic_masked@f3}} masked and
    {{t18_probes_val_a/liquid_d1-ultra/ic_unmasked@f3}} unmasked; the largest rise, drex-v2.0's, is
    {{t18_probes_val_a/nace-ai_drex-v2.0/unmasked_minus_masked@signed2}}, t
    {{t18_probes_val_a/nace-ai_drex-v2.0/unmasked_minus_masked_t@f2}}). (c) ICs on real against shuffled news on the same events (Laya-Fin
    {{t18_probes_val_a/laya_fin/ic_real_same_events@f3}} and {{t18_probes_val_a/laya_fin/ic_shuffled@f3}}); the
    anchor is uninformative (near-constant outputs). ‡ span-02: S5 STOP after the freeze, the operator proceeded
    (PREREG §15).

figA4_ablations:
  section: appendix
  title: Call B's judgments carry no information about the next days' drift, with or without the news
  caption: >-
    Call B ablations for d1-ultra (S8, on the same test events; t16): the IC of J, C and N̂ with y2, real (filled)
    against (a) the news removed and (b) shuffled news (hollow), with 95% intervals of ±[[1.96]] Newey–West SE. J's IC
    is {{t16_robustness/d1_ultra:D2:b2_no_news:j:real/ic_y2@signed2}} with the news and
    {{t16_robustness/d1_ultra:D2:b2_no_news:j:ablated/ic_y2@signed2}} without it, and
    {{t16_robustness/d1_ultra:D2:b2_shuffled:j:real/ic_y2@signed2}} against
    {{t16_robustness/d1_ultra:D2:b2_shuffled:j:ablated/ic_y2@signed2}} with shuffled news: the judgments carry no
