    and (b) d1-ultra on val-A (hollow circles), val-B (hollow squares) and the test (filled), with 95% intervals ($\pm$[[1.96]]
    $|$difference$/t|$). Shaded rows were selected on validation ($t \geq [[1]]$ in val-A and in val-B, pooled $t \geq [[2]]$). None
    held on the test: their test differences run from {{t38_conditioning/laya_fin|e9_division/diff@signed2}} (Laya-Fin's E9, the
