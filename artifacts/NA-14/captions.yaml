    one-day books are mostly costs (net Sharpe
    {{t20_strategies/test|S-D0|laya_fin|D0|n_tilde|close_t|all/sharpe_net_10@signed2}} and
    {{t20_strategies/test|S-D1|laya_fin|D1|j|close_t|all/sharpe_net_10@signed2}}, gross
