    t1b, the IC from t3) and 95% intervals (main: stationary block bootstrap; variants: ±[[1.96]] Newey–West SE).
    Laya-Fin's [[H1]] and [[H1b]] stay within their intervals of zero in every variant. d1-ultra's [[H1]] stays
