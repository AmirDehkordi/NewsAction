figA9_shapley:
  section: appendix
  title: The value of information at the close is about zero for every feature group
  caption: >-
    Exact Shapley values of the test-period out-of-sample $R^2$ (a to c) and mean daily IC (d to f) of $y_2$ at D2
    over the feature groups $R$ (price and reaction), $N$ (news, Call A) and $J$ (judgements, Call B), for all
    member-days and by size tier, with the full model's total $R + N + J$ (diamond), from the [[H3]] ridge fits
    (§11.5); values in units of [[$10^{-3}$]], and each row on one scale. One column per instrument: Laya-Fin,
    d1-ultra (model-specific) and the anchor (uninformative, near-constant outputs). Every $R^2$ total is negative, in
    every tier; for all member-days it is {{t13_shapley/laya_fin:all:r2:total/shapley@f4}} for Laya-Fin,
    {{t13_shapley/d1_ultra:all:r2:total/shapley@f4}} for d1-ultra and {{t13_shapley/anchor:all:r2:total/shapley@f4}}
    for the anchor, so the Shapley shares are shares of nothing and are not drawn. The IC totals are small and of both
    signs, from {{t13_shapley/laya_fin:mid:ic:total/shapley@f3}} (Laya-Fin, [[101 to 250]]) to
    {{t13_shapley/laya_fin:top100:ic:total/shapley@f3}} (Laya-Fin, Top-100). [[H3]] is {{t1_primary/H3/verdict}} for
    Laya-Fin (Holm p {{t1_primary/H3/primary_p_holm}}).

