figA18_conditioning_map:
  section: appendix
  title: "Exploratory (post hoc): the conditioning study, validation against test"
  caption: >-
    Exploratory (post hoc): NA-13b, requested after unblinding; no hypothesis, no claim. Thresholds and medians come from val-A; the
