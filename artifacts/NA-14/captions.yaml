    events are ranked by its conviction $|\hat N|$ (solid lines) or, for Laya-Fin and d1-ultra, by its stated
    confidence (thin lines, hollow dots); a coverage keeps the events at or above the val-A quantile of the ranking.
    Rows: (a) the mean signed overnight move $\mathrm{sign}(\hat N)\,z_{on}$, (b) the mean signed move after the open
    $\mathrm{sign}(\hat N)\,z_{id}$, (c) the hit rate against $z_{cc}$; columns val-A, val-B and test; bands are 95%
    bootstrap intervals; the dashed line is the frozen confidence gates' coverage (their val-A [[70th]] percentile).
    Conviction concentrates the overnight move, which the open prices: d1-ultra's surest [[10%]] carry
    {{t36_selective_coverage/d1_ultra|conviction|0.1|test|z_on/signed@f2}} typical moves on the test against
    {{t36_selective_coverage/d1_ultra|conviction|1.0|test|z_on/signed@f2}} for all its events. After the open little
    is left: {{t36_selective_coverage/d1_ultra|conviction|0.1|test|z_id/signed@f2}} (95% interval
    {{t36_selective_coverage/d1_ultra|conviction|0.1|test|z_id/signed_ci_low@f2}} to
    {{t36_selective_coverage/d1_ultra|conviction|0.1|test|z_id/signed_ci_high@f2}}) for d1-ultra's surest [[10%]] and
    {{t36_selective_coverage/laya_fin|conviction|0.1|test|z_id/signed@f2}} for Laya-Fin's; neither model's test
    interval excludes zero at any coverage. span-02's and drex-v2.0's val-A points come from NA-06's
