figA16_selective_coverage:
  section: appendix
  title: "Exploratory (post hoc): risk-coverage curves of the pre-open reading"
  caption: >-
    Exploratory (post hoc): NA-13b, requested after unblinding; no hypothesis, no claim. Its thresholds come from
