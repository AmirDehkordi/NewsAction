[project]
name = "newsaction"
version = "0.0.0"
description = "Decision models x financial news: look-ahead-free reaction and over/underreaction research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3",
    "pyarrow",
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "tenacity",
    # Pinned exactly: half-day and closure handling can drift between releases (golden tests guard it).
    "exchange-calendars==4.13.2",
    "arch",
    "matplotlib",
    "tqdm",
    "filelock",
]

[project.optional-dependencies]
# Declared now, installed only by the chunks that need them (`uv sync --extra embed`, ...).
embed = ["torch", "sentence-transformers", "transformers", "spacy", "en-core-web-sm"]
laya = ["laya"]
kaggle = ["kaggle"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsaction"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# spaCy English pipeline for NA-04 person-name masking (PREREG §6.3); release wheel pinned by URL + lock hash.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "DTZ"]
ignore = [
    "N818",   # exception names are fixed by the PRD (BudgetExceeded, LedgerCorrupt, ...)
    "RUF001", # ambiguous unicode in strings (σ, →, β are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*", "filelock.*", "sklearn.*", "laya.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--strict-markers"
filterwarnings = ["error"]
markers = [
    "network: needs network access (excluded from `make test`)",
    "slow: slow test",
]
