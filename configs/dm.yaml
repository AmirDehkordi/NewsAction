# Decision-model client (PRD NA-05; CLAUDE.md C12–C14, D15). Read by newsaction.dm (DmConfig).
# Hashed into the NA-11 freeze with every configs/*.yaml (PREREG §4.4). Selections (eligible models, :free
# approvals, the val-B gate) live in configs/frozen.yaml, not here.

version: 1

api:
  decisions_url: "https://openrouter.ai/api/alpha/decisions"   # POST, Bearer key (OpenRouter Decisions API, alpha)
  chat_url: "https://openrouter.ai/api/v1/chat/completions"     # POST, chat_json only (NA-09 S7: the generative LLM)
  models_url: "https://openrouter.ai/api/v1/models"             # GET catalog (no spend)
  key_url: "https://openrouter.ai/api/v1/key"                   # GET the key's usage in USD (no spend)
  credits_url: "https://openrouter.ai/api/v1/credits"           # GET the account's credits and usage (no spend)
  chat_catalog: artifacts/NA-09/llm_catalog.json                # chat-model price snapshot (NA-09 S7), as catalog.json
  catalog_params: {output_modalities: decisions}
  key_env: OPENROUTER_API_KEY     # read from the environment or .env; never printed, logged or stored
  timeout_s: 120.0
  concurrency: 4                  # default asyncio semaphore; a run may override it
  retry:                          # 429, 5xx and transport errors: exponential backoff with full jitter
    max_attempts: 5
    initial_s: 1.0
    max_s: 30.0
  record_headers:                 # response headers kept in the cache's attempts table (rate limits)
    - x-ratelimit-limit
    - x-ratelimit-remaining
    - x-ratelimit-reset
    - retry-after

cache: cache/decisions.sqlite     # gitignored

# Models that refuse a state object (HTTP 400 "state must be a string or an object with only ...") and take the
# state as a string: the client sends them the state's canonical JSON text, the same bytes (and state_sha256)
# that an object state is serialized to. Filled from the NA-05 smoke test.
state_as_text:                    # NA-05 smoke test (artifacts/NA-05/pilot.json "smoke")
  - scaledown/classify-1          # "ScaleDown state must be a string or an object with only text, document, …"

# NA-11 S5 canary drift check (operator decision 2026-10-26, NA-05 REPORT §9 item 3). NA-11 implements the
# comparison; NA-05 records the rule. "Deterministic" = identical answers on all 5 pilot repeats (pilot.json
# item 4); a model without pilot repeats gets its 5 repeats measured first (repeats 0–4 of the 20 Call A states).
canary:
  noise_repeats: 5                          # the model's own repeat noise: repeats 0–4 of the 20 Call A states
  deterministic_max_abs_dp: 0.02            # a deterministic model: STOP if any probability moved >= 0.02
  noisy_rule: mean_abs_dp_vs_repeat_noise   # any other model: the canary's mean |Δp| vs its own repeat noise
  deterministic:                            # identical on all 5 repeats in the NA-05 pilot
    - openai/gpt-6-luna-decisions
    - perplexity/pplx-decider-v1.2
    - local/laya-typed-decisions
    - local/laya-base

# Refusal (d): an unmasked state is sent only under one of these probe tags.
registered_probes:
  unmasked_twin: "PREREG §8.3 masked vs unmasked IC on the same events (NA-06 stage 2)"
  unmasked_robustness: "PREREG §11.6 robustness: unmasked states (NA-11)"

# Dry-run projections (costmodel.py). usd = (prompt price × tokens + request price) × (1 − discount) × safety.
# tokens = overhead + billed bytes / bytes_per_token, where the billed bytes are the canonical JSON of the
# state once plus every question ("once"), or the state again with every question ("per_question").
costmodel:
  chat:                           # chat_json (NA-09 S7): tokens = overhead + bytes of messages and schema / bytes_per_token,
    bytes_per_token: 3.0          # output = max_tokens; priced with prompt and completion prices; conservative on purpose
    overhead_tokens: 64
    safety: 1.5
  default:                        # used for a model without a pilot calibration; conservative on purpose
    billing_basis: per_question
    bytes_per_token: 3.0
    overhead_tokens: 64
    safety: 1.5
  models:                        # pilot calibration (python -m newsaction.dm.pilot --stage report)
