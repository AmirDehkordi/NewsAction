laya:
  repo: convaiinnovations/laya
  revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851   # laya 0.4.14 PINNED_REVISIONS (reviewed); same weights as main @ 7b928d82
  weights_sha256:                 # LFS sha256 of model.safetensors at that revision (checked before loading)
    "": 891102d372688fc2a094dac56a384bc537b87c63f21f9f3dac0be2b7cbc8d86c
    typed-decisions: 4fa56de72383a9d3efa9cfa78955733c81b9fc8067a587ca4beb82c78107a24e
  variants:                       # model id -> checkpoint subfolder ("" = the repository root)
    local/laya-typed-decisions: typed-decisions
    local/laya-base: ""
  max_len: 1024                   # PREREG §9.1
  head_max_len: null              # null: the checkpoint's own (typed-decisions 256, root 192)
  device: mps                     # falls back to cpu when MPS is unavailable
  fp32: true                      # no fp16 autocast on MPS (Laya switches it on at >= 5 question rows)
