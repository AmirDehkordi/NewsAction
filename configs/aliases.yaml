# Company aliases for masking (PREREG §6.3; PRD NA-04 S3; newsaction.states.mask).
#
# A company's alias set is built from:
#   1. its ATOM names (work/panel/companies.parquet, every share class), with share-class designations and
#      legal suffixes removed, "(The)" / "(Eli)" moved to the front ("Home Depot (The)" -> "The Home Depot",
#      "Home Depot"), every leading word prefix of two or more words ("American Airlines Group" ->
#      "American Airlines"), and the first word alone when it has 4+ letters and is not a common word below;
#   2. the curated `names` below: common names, short forms and former names, hand-written for every company
#      that ranked in the top 150 by market cap in any month from 2024-01 (NA-01 tiers), plus renamed companies,
#      plus the names found right before a company's own "(TICKER)" in the event texts (NA-04 verification);
#   3. its tickers: every class's ATOM ticker, ATOM ref.symbol_ticker rows, the NA-02 vendor ticker aliases
#      (configs/news.yaml) and the curated `tickers` below, in the forms TICKER, $TICKER, EXCH:TICKER (any
#      upper-case exchange code, e.g. BOATS:NEE), "(TICKER ...)", TICKER.O / TICKER/PR, TICKER's; class
#      separators "." "-" "/" are interchangeable.
# Phrases and their distinctive words match in any case (spaces, hyphens and en dashes interchangeable); a
# one-word name that is a common word below, or shorter than 4 letters, only as written or in capitals.
# Tickers match in upper case only. Products and subsidiaries that are not names of the company itself
# (iPhone, Instagram, Keytruda) are not masked: NA-06 measures what remains identifiable (PRD NA-04 risks).

legal_suffixes: ["& Co", "& Company", and Company, Hldgs, Inc, Incorporated, Corp, Corporation, Co, Company, Companies,
                 Ltd, Limited, plc, PLC, Plc, N.V., NV, S.A., SA, SE, AG, LP, L.P., LLC, L.L.C., Holdings Co, Group Inc]

