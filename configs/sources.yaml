# Source classes of news domains (newsaction.news.sources; PRD NA-02 S9; PREREG §6.6 F3, §1.2 cut).
# Every one of the top 100 domains by member-article volume (2023-07..2026-07) is listed under `domains`
# (tests/test_news_sources.py checks this against artifacts/NA-02/top_domains.csv). Classes:
#   press_wire_primary  press-release wires, regulatory filings feeds, company / IR sites
#   major_outlet        national and international news organizations and established trade press
#   aggregator          portals that republish or syndicate other outlets' stories and wires
#   retail_analysis     investor commentary and analysis written for retail readers
#   auto_generated      template or machine-written articles (13F / insider / price-move bots, AI summaries,
#                       market-research release mills)
#   other               everything else (blogs, social media, job boards, consumer sites)
# `source_class` additionally becomes press_wire_primary when the vendor flag tag_primary_source is True.

domains:
  press_wire_primary:
    - prnewswire.com
    - businesswire.com
    - globenewswire.com
    - accesswire.com
    - newsfilecorp.com
    - einpresswire.com
    - sec.gov
    - stocktitan.net           # verbatim press releases and SEC filings (92% vendor primary-source)
    - quantisnow.com           # SEC filing feed (89% primary-source)
    - markets.ft.com           # FT markets data pages hosting company announcements (95% primary-source)
