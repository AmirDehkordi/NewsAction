# Availability registry (CLAUDE.md A5): when each column becomes known relative to session s.
# newsaction.pit.AvailabilityRegistry loads this file; check_inputs() refuses any column that is
# unknown here or whose kind is not visible at the decision point. Every chunk that creates a
# state/model input column registers it here.
#
# Decision points (PREREG §2.5) see these kinds (cumulative):
#   D0 (09:15 ET):     static, t_minus_1, w0
#   D1 (10:00 ET):     D0 + d1
#   D2 (after close):  D1 + w2, d2_reaction
#   "post" and "selection_only" are visible at no decision point.

kinds:
  static: known at any time (identifiers, the session date itself, fixed metadata)
  t_minus_1: computed only from data through close(prev(s)) (beta, sigma, tiers, momentum, market context)
  w0: derived from news with t_avail in W0(s) = (close(prev(s)), 09:15 ET of s]
  d1: observed reaction from close(prev(s)) to the 10:00 bar close of s (NA-10 bars)
  w2: derived from news with t_avail in W2(s) = (close(prev(s)), close(s)]
  d2_reaction: observed full-day reaction close(prev(s)) -> close(s) (e.g. G at D2 = z_cc,t)
  post: outcomes and labels (targets); never a model input
  selection_only: vendor labels produced retrospectively (tags, sentiment, summaries, event clusters); may select news, never a model input (CLAUDE.md A6)

columns:
  # --- identifiers and fixed metadata (NA-00 seeds + NA-01 panel)
  session: static
  symbol_id: static
  company_id: static
  ticker: static
  member: static              # index membership at open(s) (uni.member; changes are announced in advance)
  sector: static              # GICS level 1 (ATOM ref.symbol_sector, one open-ended range per symbol)
  half_day: static
  split: static
  adj_source: static          # data_prices | atom_total (PREREG §15)
  price_symbol: static
  # --- t-1 context (PREREG §3.3, §5.3-5.4): computed only from data through close(prev(s))
  tier: t_minus_1             # ranking at the last session of the previous month
  rank: t_minus_1
  dv_tier: t_minus_1
  dv_rank: t_minus_1
  tier_source: t_minus_1
  is_rep: t_minus_1           # representative share class, chosen at the previous month end
  beta_m: t_minus_1
  beta_s: t_minus_1
  beta_n: t_minus_1
  sigma_cc: t_minus_1
  sigma_on: t_minus_1
  sigma_id: t_minus_1
  logv_med60: t_minus_1
  logv_mad60: t_minus_1
  adv63: t_minus_1
  car_m5: t_minus_1
  car_m20: t_minus_1
  car_m60: t_minus_1
  z_m5: t_minus_1
  z_m20: t_minus_1
  z_m60: t_minus_1
  # --- news blocks
  news_w0: w0
  news_w2: w2
  # --- observed reactions (PREREG §5.5, A1.2)
  g_d1: d1
  g_d2: d2_reaction
  g_d2_lvl: d2_reaction
  react_r_cc: d2_reaction
  react_r_spy_cc: d2_reaction
  react_z_vol: d2_reaction
  # --- same-day quantities of session s (known after close(s)); never model inputs as such
  raw_open: post
  raw_close: post
  raw_volume: post
  adj_close: post
  adj_open: post
  adj_factor: post
  r_cc: post
  r_on: post
  r_id: post
  r_spy_cc: post
  r_spy_on: post
  r_spy_id: post
  r_sec_cc: post
  r_sec_on: post
  r_sec_id: post
  r_sec_n: post
  ar_cc: post
  ar_on: post
  ar_id: post
  z_vol: post
  qc_rule: post
  qc_flag: post
  # --- targets (PREREG §5.6, A1.2); same-day quantities used as D2 inputs need their own d2_reaction column
  z_on: post
  z_cc: post
  z_id: post
  y0: post
  y1: post
  y2: post
  e5: post
  ar_o0_c1: post
  z_o0_c1: post
  ar_o0_c5: post
  z_o0_c5: post
  ar_c0_o1: post
  z_c0_o1: post
  ar_o1_c1: post
  z_o1_c1: post
  ar_o1_c5: post
  z_o1_c5: post
  ar_o1_c20: post
  z_o1_c20: post
  fwd_lvl_o1_c1: post
  fwd_lvl_o1_c5: post
  fwd_lvl_o1_c20: post
  car6_z: post
  car_lvl_o0: post
  car_lvl_c0: post
  car_lvl_c1: post
  car_lvl_c2: post
  car_lvl_c5: post
  car_lvl_c10: post
  car_lvl_c20: post
  car_lvl_c60: post
  e5_lvl: post
  delist_within_c20: post
  # --- NA-02 articles (work/news/articles_clean.parquet). Article-level columns are known at the article's
  # t_avail: kind w0 means usable at D0 of session s for rows with session_w0 == s (and at D2 for rows with
  # session_w2 == s); the row-level check is pit.assert_visible(t_avail <= decision instant).
  id: static                  # article id (NewsWitch)
  ticker_raw: w0
  ts_pub_utc: w0
  precision: w0
  t_avail: w0
  session_w0: w0
  session_w2: w0
  domain: w0
  source_class_domain: w0     # domain only
  title: w0                   # raw text: contains after-the-fact and pre-market price talk
  snippet: w0
  title_clean: w0             # scrubbed (PREREG §6.4): the Call A text
  snippet_clean: w0
  is_13f: w0                  # from the title text
  is_form4: w0
  after_fact: w0
  premarket_talk: w0
  has_clean_text: w0
  non_english_hint: w0          # heuristic language flag (detectors and masking are English-only)
  dup_group: w0               # greedy, backward-looking groups: known at the article's t_avail
  is_representative: w0
  dup_count_w0: w0            # group members in the representative's W0 window
  dup_count_w2: w2            # group members in the representative's W2 window
  dup_count: post             # total group size, including later duplicates
  novelty: w0                 # strictly earlier representatives only (PREREG §6.5)
  # vendor labels and the flags derived from them: selection only (CLAUDE.md A6)
  source_class: selection_only    # domain class overridden by tag_primary_source
  summary_present: selection_only
  non_news: selection_only
  junk_tag: selection_only
  keep: selection_only            # passes PREREG §6.2 (uses non_news and the vendor tag)
  third_party_ok: selection_only  # data-governance flag (PREREG §6.1)
  parsing_allowed: selection_only
  sentiment_direction: selection_only
  sentiment_intensity: selection_only
  tag_type: selection_only
  tag_type2: selection_only
  tag_scheduled: selection_only
  tag_forward_looking: selection_only
  tag_primary_source: selection_only
  tag_quantified: selection_only
  tag_rumor: selection_only
  tag_source: selection_only
  event_id: selection_only
  event_age_days: selection_only
  # --- NA-03 labels, scores and events (work/events/*.parquet). Window columns carry the window's suffix:
  # *_w0 columns of events_d0 are known at D0 of the session, *_w2 columns of events_d2 at D2. The event key
  # `event_id` shares its name with the vendor story cluster above (selection_only): an identifier, never a
  # model input.
  month: static
  window: static
  decision_point: static
  embargo: static               # PREREG §4.2 evaluation flag (calendar)
  horizon_end: static           # t+5 session of the label (calendar)
  tie_u: static                 # seeded tie-breaker of the budget selection
  material: post                # PREREG §6.7 label (returns t..t+5)
  delayed: post                 # PREREG §6.8 delayed-reaction label
  material_on: post
  material_car: post
  material_vol: post
  car_delayed_z: post
  label_ok: post
  purged: post
  f0: selection_only            # rule filters use vendor fields (PREREG §6.6)
  f1: selection_only
  f2: selection_only
  f3: selection_only
  f4: w0                        # novelty (PIT)
  f5: selection_only            # learned on returns: a selection score, never a model input
  f6: selection_only
  f6_w0: selection_only
  f6_w2: selection_only
  n_kept: selection_only
  n_f1: selection_only
  n_f2: selection_only
  n_f3: selection_only
  filter_score_w0: selection_only
  filter_score_w2: selection_only
  n_articles_w0: w0             # usable articles in W0 (near-duplicates included)
  n_stories_w0: w0              # distinct stories (representatives)
  n_dup_w0: w0
  attention_mean_w0: t_minus_1  # mean n_articles_w0 over the previous 60 member sessions
  attention_ratio_w0: w0
  n_articles_w2: w2
  n_stories_w2: w2
  n_dup_w2: w2
  attention_mean_w2: t_minus_1
  attention_ratio_w2: w2
  n_list_w0: w0
  n_dropped_cap_w0: w0
  news_tokens_w0: w0
  n_non_english_w0: w0
  n_ok_w0: selection_only       # third-party-OK counts (data-governance flag)
  n_not_third_party_w0: selection_only
  n_list_w2: w2
  n_dropped_cap_w2: w2
  news_tokens_w2: w2
  n_non_english_w2: w2
  n_ok_w2: selection_only
  n_not_third_party_w2: selection_only
  clean_1: post                 # A1.2 clean-window flags look forward: analysis sample flags only
  clean_2: post
  clean_5: post
  clean_10: post
  clean_20: post
