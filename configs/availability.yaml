# Availability registry (CLAUDE.md A5): when each column becomes known relative to session s.
# newsaction.pit.AvailabilityRegistry loads this file; check_inputs() refuses any column that is
# unknown here or whose kind is not visible at the decision point. Every chunk that creates a
# state/model input column registers it here.
#
# Decision points (PREREG §2.5) see these kinds (cumulative):
#   D0 (09:15 ET):     static, t_minus_1, w0
#   D1 (10:00 ET):     D0 + d1
#   D2 (after close):  D1 + w2, d2_reaction
#   "post" is visible at no decision point.

kinds:
  static: known at any time (identifiers, the session date itself, fixed metadata)
  t_minus_1: computed only from data through close(prev(s)) (beta, sigma, tiers, momentum, market context)
  w0: derived from news with t_avail in W0(s) = (close(prev(s)), 09:15 ET of s]
  d1: observed reaction from close(prev(s)) to the 10:00 bar close of s (NA-10 bars)
  w2: derived from news with t_avail in W2(s) = (close(prev(s)), close(s)]
  d2_reaction: observed full-day reaction close(prev(s)) -> close(s) (e.g. G at D2 = z_cc,t)
  post: outcomes and labels (targets); never a model input

columns:
  # --- identifiers and fixed metadata (NA-00 seeds + NA-01 panel)
  session: static
  symbol_id: static
  company_id: static
  ticker: static
  member: static              # index membership at open(s) (uni.member; changes are announced in advance)
  sector: static              # GICS level 1 (ATOM ref.symbol_sector, one open-ended range per symbol)
  half_day: static
  split: static
  adj_source: static          # data_prices | atom_total (PREREG §15)
  price_symbol: static
  # --- t-1 context (PREREG §3.3, §5.3-5.4): computed only from data through close(prev(s))
  tier: t_minus_1             # ranking at the last session of the previous month
  rank: t_minus_1
  dv_tier: t_minus_1
  dv_rank: t_minus_1
  tier_source: t_minus_1
  is_rep: t_minus_1           # representative share class, chosen at the previous month end
  beta_m: t_minus_1
  beta_s: t_minus_1
  beta_n: t_minus_1
  sigma_cc: t_minus_1
  sigma_on: t_minus_1
  sigma_id: t_minus_1
  logv_med60: t_minus_1
  logv_mad60: t_minus_1
  adv63: t_minus_1
  car_m5: t_minus_1
  car_m20: t_minus_1
  car_m60: t_minus_1
  z_m5: t_minus_1
  z_m20: t_minus_1
  z_m60: t_minus_1
  # --- news blocks
  news_w0: w0
  news_w2: w2
  # --- observed reactions (PREREG §5.5, A1.2)
  g_d1: d1
  g_d2: d2_reaction
  g_d2_lvl: d2_reaction
  react_r_cc: d2_reaction
  react_r_spy_cc: d2_reaction
  react_z_vol: d2_reaction
  # --- same-day quantities of session s (known after close(s)); never model inputs as such
  raw_open: post
  raw_close: post
  raw_volume: post
  adj_close: post
  adj_open: post
  adj_factor: post
  r_cc: post
  r_on: post
  r_id: post
  r_spy_cc: post
  r_spy_on: post
  r_spy_id: post
  r_sec_cc: post
  r_sec_on: post
  r_sec_id: post
  r_sec_n: post
  ar_cc: post
  ar_on: post
  ar_id: post
  z_vol: post
  qc_rule: post
  qc_flag: post
  # --- targets (PREREG §5.6, A1.2); same-day quantities used as D2 inputs need their own d2_reaction column
  z_on: post
  z_cc: post
  z_id: post
  y0: post
  y1: post
  y2: post
  e5: post
  ar_o0_c1: post
  z_o0_c1: post
  ar_o0_c5: post
  z_o0_c5: post
  ar_c0_o1: post
  z_c0_o1: post
  ar_o1_c1: post
  z_o1_c1: post
  ar_o1_c5: post
  z_o1_c5: post
  ar_o1_c20: post
  z_o1_c20: post
  fwd_lvl_o1_c1: post
  fwd_lvl_o1_c5: post
  fwd_lvl_o1_c20: post
  car6_z: post
  car_lvl_o0: post
  car_lvl_c0: post
  car_lvl_c1: post
  car_lvl_c2: post
  car_lvl_c5: post
  car_lvl_c10: post
  car_lvl_c20: post
  car_lvl_c60: post
  e5_lvl: post
  delist_within_c20: post
