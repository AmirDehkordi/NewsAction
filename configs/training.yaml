# NA-08: trained decision models on Kaggle, Laya-Fin (primary) and the ModernBERT-large clean anchor.
# Values equal docs/PREREG.md §4, §7, §9, §11 and PRD NA-08 (tests/test_train_config.py checks them).
# Hashed into the NA-11 freeze (PREREG §4.4).

encoding: E3                      # PREREG §9.1: the API states (E3 unless NA-07 picks another; then retrain once)
states:                           # NA-04 state files (work/), one per source = call × window
  A_W0: states/callA_d0_E3.parquet    # Call A on D0 (W0 news)
  A_W2: states/callA_d2_E3.parquet    # Call A on D2 (W2 news, PREREG A3.1)
  B_W2: states/callB_d2_E3.parquet    # Call B on D2 (W2 news + reaction_so_far)

labels:                           # PREREG §9.1, PRD NA-08 S1: panel_public, sessions <= the end of val-B, purged
  splits: [train, val_a, val_b]
  edges: [0.5, 1.0, 2.0, 3.0]     # |z| bins [0, 0.5) [0.5, 1) [1, 2) [2, 3) [3, inf): codebook move words (§6.11)
  react_horizon: 4                # H-react: e5 = AR(C_{t-1} -> C_{t+4}) / (σ_cc·√5); level = 4 + sign(e5)·bin(|e5|)
  mag_horizon: 0                  # H-mag: bin(|z_cc,t|), levels 0..4
  cont_horizon: 5                 # H-cont: y2 = z(O_{t+1} -> C_{t+5})
  cont_min_abs_g: 0.5             # H-cont only for Call B D2 events with |G| >= 0.5
  cont_band: 0.5                  # x = sign(G)·y2: reverse if x <= -0.5, continue if x >= 0.5, else stall

questions:                        # PRD NA-08 S2 (Laya's input format: {type, instructions, criteria})
  react: {battery: justified_move}    # Q1 (configs/questions_v1.yaml), the H-react head
  cont: {battery: continuation}       # Q6, the H-cont head
  mag:                                # H-mag: an internal training question, never sent to an API model
    type: score
    instructions: "How large will the stock's move relative to the market and its sector be today?"
    criteria:
      - "negligible (< 0.5 typical daily moves)"
      - "small (0.5–1)"
      - "moderate (1–2)"
      - "large (2–3)"
      - "very large (> 3 typical daily moves)"
  by_source:                          # the questions asked of each source
    A_W0: [react, mag]
    A_W2: [react, mag]
    B_W2: [react, cont]

export:                           # PRD NA-08 S2
  seed: 2026                      # block-dropout draws u = sha256("2026:{block}:{source}:{event_id}") / 2^256
  reaction_dropout: 0.3           # PREREG §9.1: a train Call B state gets a copy without reaction_so_far (react)
  context_dropout: 0.1            # PREREG §9.1: a train state gets a copy without the context blocks
  context_blocks: [attention, company, market]
  dataset_id: amirdehkordi98/newsaction-na08-states
  dataset_title: NewsAction NA-08 masked states
  license: other

model:                            # PREREG §9.1–9.2, PRD NA-08 S3
  max_len: 1036                   # PREREG §9.1 1024 → 1036 (§15 NA-08 row, operator 2026-10-26): no state is cut
  head_max_len: 143               # operator decision 2026-10-26: the longest trained question in Laya's rendering
  laya:                           # Laya-Fin init (convaiinnovations/laya, subfolder typed-decisions)
    repo: convaiinnovations/laya
    subfolder: typed-decisions
    revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851   # laya 0.4.14 reviewed pin; typed-decisions = HEAD 7b928d82
    weights_sha256: 4fa56de72383a9d3efa9cfa78955733c81b9fc8067a587ca4beb82c78107a24e
  anchor:                         # the clean anchor: the encoder only, a fresh head (PREREG §9.2)
    repo: answerdotai/ModernBERT-large
    revision: 45bb4654a4d5aaff24dd11d4781fa46d39bf8c13   # 2025-01-15; weights unchanged since Dec 2024
    weights_sha256: 44510fec5d3a81a1877f225637b869495f18e55f6f23a09abb9be0acc030295f
  head_layers: 2                  # Laya's decision head: 2 transformer layers + option-marker scorer
  act_costs: {escalate: 0.5}      # Laya's act head (2 outputs); frozen and unused (model card: no signal)
  seeds: [13, 17, 23]             # PREREG §9.1; the reported model is the 3-seed ensemble
  max_epochs: 3                   # PREREG §9.1: <= 3 epochs, early stopping on val-A loss
  lr_backbone: 2.0e-5
  lr_head: 1.0e-4
  min_lr: 1.0e-6
  warmup_frac: 0.03
  weight_decay: 0.01
  grad_clip: 1.0
  micro_batch: 8                  # per GPU; effective batch 8 × 2 GPUs × 4 = 64 (the official notebook)
  grad_accum: 4
  grad_checkpointing: true        # encoder and head (official); the pilot also measures it off
  eval_batch: 32
  loss: rlcd                      # laya.train.rlcd_loss: proper-scoring policy gradient + soft cross-entropy
  rl_samples: 4
  sigma_start: 0.4
  sigma_end: 0.1
  w_sph: 0.75
  w_rps: 1.0
  amp: fp16                       # T4
  time_budget_hours: 11.25        # stop before Kaggle's 12-hour session limit, keeping the best epoch
  pip: ["laya==0.4.14", "transformers==5.20.2"]

kaggle:                           # PRD NA-08 S4, S6
  accelerator: NvidiaTeslaT4      # GPU T4 x2
  session_hours: 12
  weekly_gpu_hours: 30
  kernel_prefix: newsaction-na08
  pilot:
    train_fraction: 0.05
    steps: 200                    # micro-batches per GPU
    rehearsal: {val_a: 2000, val_b: 500, test: 500}   # the whole output path on small subsets
    launches:                     # one torchrun each; a failed optional launch (e.g. out of memory) is recorded
      - {name: laya, init: laya, rehearse: true, required: true}
      - name: laya-nockpt
        init: laya
        rehearse: false
        required: false
        hparams: {grad_checkpointing: false, micro_batch: 4, grad_accum: 8}   # same effective batch
      - {name: modernbert, init: modernbert, rehearse: true, required: true}
  runs:                           # operator decision 2026-10-27: one seed per model within this week's quota
                                  # (PREREG §15 NA-08 row); 1 epoch per run: 2 do not fit a 12-hour session
    - {name: pilot, mode: pilot, inits: [laya, modernbert]}
    - {name: shuffle-s13, mode: train, init: laya, seed: 13, epochs: 1, shuffle_labels: true, predict: [val_a]}
    - {name: laya-s13, mode: train, init: laya, seed: 13, epochs: 1}
    - {name: anchor-s13, mode: train, init: modernbert, seed: 13, epochs: 1}
    - {name: repro-s13, mode: train, init: laya, seed: 13, epochs: 1, predict: [val_a]}   # controls: val-A only
    - {name: laya-s17, mode: train, init: laya, seed: 17, epochs: 1, deferred: true}
    - {name: laya-s23, mode: train, init: laya, seed: 23, epochs: 1, deferred: true}
    - {name: anchor-s17, mode: train, init: modernbert, seed: 17, epochs: 1, deferred: true}
    - {name: anchor-s23, mode: train, init: modernbert, seed: 23, epochs: 1, deferred: true}

derived:                          # PREREG §7
  react_midpoints: [-3.5, -2.5, -1.5, -0.75, 0.0, 0.75, 1.5, 2.5, 3.5]
  mag_midpoints: [0.25, 0.75, 1.5, 2.5, 3.5]   # NA-08: the middle of each |z| bin; the last as in Q1 (3.5)

evaluation:                       # PREREG §11.1–11.4 (val-A only in NA-08)
  ece_bins: 15
  min_names_per_day: 10
  nw_lags: 5
  bootstrap_block: 5
  bootstrap_reps: 10000
  bootstrap_seed: 2026

controls:                         # PREREG §9.3, PRD NA-08 S5
  shuffle_run: shuffle-s13
  shuffle_permutation_seed: 2026
  shuffle_t_max: 2.0              # val-A mean daily IC of N̂ vs e5 not significant: |t| < 2
  repro_runs: [laya-s13, repro-s13]
  repro_ic_tol: 0.003
